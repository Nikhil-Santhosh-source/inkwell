# Publishes the app to GitHub Pages on every push to main.
# The tests run first; if any fail, nothing is published and the iPad
# keeps the version it has.

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Also copies the PDF library into app/vendor (postinstall).
      - run: npm ci
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
